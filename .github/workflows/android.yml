name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip git cmake libffi-dev libssl-dev zlib1g-dev libncurses5-dev libtinfo5
          pip install buildozer cython
      
      - name: Build APK
        run: buildozer android debug
        timeout-minutes: 45
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 罗盘工具-debug.apk
          path: bin/*.apk
